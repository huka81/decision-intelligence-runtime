site_name: Decision Intelligence Runtime (DIR)
site_description: Deterministic execution kernel for autonomous AI agents.
repo_url: https://github.com/huka81/decision-intelligence-runtime
site_url: https://huka81.github.io/decision-intelligence-runtime/

# docs_dir must be a subfolder of the repo root (not "."). docs/index.md pulls in ../README.md
# via mkdocs-include-markdown-plugin (relative URL rewrite).
docs_dir: docs

exclude_docs: |
  **/*.not-push.md

hooks:
  - mkdocs_hooks.py

plugins:
  - include-markdown:
      rewrite_relative_urls: true
  - search

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Introduction:
      - DIR introduction: 00-introduction/DIR-introduction.md
      - Intelligent delegation framework mapping: 00-introduction/Intelligent_Delegation_Framework_Mapping.md
  - ROA manifesto: 01-roa-manifesto/ROA_Manifesto.md
  - Decision runtime: 02-decision-runtime/DIR_Architectural_Pattern.md
  - Topologies: 03-topologies/DIR_Topologies.md
  - Governance & agent drift: 04-governance/DIR_Governance.md
  - DIR minified (context as code): 07-dir-minified/DIR-minified.md
  - Conclusion:
      - Context as code: 08-conclusion/Context_as_Code.md
