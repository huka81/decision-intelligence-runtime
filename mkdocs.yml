site_name: Decision Intelligence Runtime (DIR)
site_description: Deterministic execution kernel for autonomous AI agents.
repo_url: https://github.com/huka81/decision-intelligence-runtime
site_url: https://huka81.github.io/decision-intelligence-runtime/

# docs_dir must be a subfolder of the repo root (not "."). docs/index.md pulls in ../README.md
# via mkdocs-include-markdown-plugin (relative URL rewrite).
docs_dir: docs

exclude_docs: |
  **/*.not-push.md

hooks:
  - mkdocs_hooks.py

plugins:
  - include-markdown:
      rewrite_relative_urls: true
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: true

# Mermaid: without this, ```mermaid fences render as plain highlighted code.
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    # Section tabs need an index page; without this, "Samples" can open a non-page URL → 404.
    - navigation.indexes
    - content.code.copy

nav:
  - Home: index.md
  - Project:
      - Introduction: 00-introduction/DIR-introduction.md
      - Responsible-Oriented Agents: 01-roa-manifesto/ROA_Manifesto.md
      - Decision Intelligence Runtime: 02-decision-runtime/DIR_Architectural_Pattern.md
      - Topologies: 03-topologies/DIR_Topologies.md
      - Governance & Agent Drift: 04-governance/DIR_Governance.md
      - Context as code: 08-conclusion/Context_as_Code.md
      - Intelligent AI delegation framework mapping: 00-introduction/Intelligent_Delegation_Framework_Mapping.md
  - Package:
      - Overview: 09-pages/package/index.md
      - Installation: 09-pages/package/installation.md
      - Architecture: 09-pages/package/architecture.md
      - Ports & Adapters: 09-pages/package/ports_and_adapters.md
      - Core Components: 09-pages/package/core_components.md
      - Models & DTOs: 09-pages/package/models.md
