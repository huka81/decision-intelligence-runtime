# Default LLM settings for Contract Studio.
# Runtime resolution (see app._build_llm):
#   1. USE_MOCK_LLM=1 → mock
#   2. CONTRACT_STUDIO_LLM=gemini|ollama|mock → force that provider
#   3. GEMINI_API_KEY / GOOGLE_API_KEY present → Gemini
#   4. Ollama reachable → Ollama
#   5. else mock
#
llm_defaults:
  # Used when CONTRACT_STUDIO_LLM=ollama or no Gemini key and Ollama is up.
  provider: "ollama"
  model: "gemma3:4b"
  base_url: "http://localhost:11434"
  timeout: 120
  # Model used when Gemini is auto-selected via API key:
  gemini_model: "gemini-flash-lite-latest"
