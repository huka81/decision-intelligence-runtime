# 32_fraud_gate — YAML-driven fraud gate (classic + scenarios.yaml)
# Run: python samples/32_fraud_gate/run.py

database:
  provider: sqlite
  db_path: "data/32_fraud_gate.db"

simulation:
  run_id: "fraud_gate_demo"
  seeds:
    scenario_order: 7

llm_defaults:
  model: "gemma3:4b"
  base_url: "http://localhost:11434"
  temperature: 0.2
  timeout: 60

contracts:
  provider: yaml

jit_validator:
  global_max_limit: 50000.0

fraud_gate:
  fallback_rules:
    block_amount_threshold: 5000
    block_high_risk_countries: [nigeria]
    allow_amount_max: 1000
    allow_velocity_max: 10
    allow_device_prefix: "dev_known_"

agents:
  - agent_id: "fraud_guard_v1"
    priority: 10
    contract:
      role: EXECUTOR
      mission: >
        You are a fraud analyst for a payment gateway. Evaluate each transaction
        and follow the ROA JSON shapes requested in the user prompts exactly.
      authorized_instruments: []
      allowed_policy_types: ["ALLOW", "BLOCK", "CHALLENGE"]
      escalate_on_uncertainty: 0.35
      max_drawdown_limit: 0.05
      wake_up_threshold_pct: 0.5
      parent_agent_id: null
