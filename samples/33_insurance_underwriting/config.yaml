# Digital Underwriter — Topology C (DL+PCI) + email ingestion

database:
  provider: sqlite
  db_path: "data/33_insurance_underwriting.db"

simulation:
  run_id: "uw_email_batch_001"
  seeds:
    llm: 42

# LLM backends — activate exactly one llm_defaults block (provider: ollama | mock | gemini).
# Inactive blocks stay commented. Gemini: set GOOGLE_API_KEY or GEMINI_API_KEY in the environment (do not put keys in this file).

# Ollama (local Gemma):
# llm_defaults:
#   provider: "ollama"
#   model: "gemma3:4b"
#   base_url: "http://localhost:11434"
#   timeout: 60

# Mock (deterministic, no network):
# llm_defaults:
#   provider: "mock"
#   timeout: 60

# GCP Gemini via Google Generative AI (Gemini API):
llm_defaults:
  provider: "gemini"
  model: "gemini-flash-lite-latest"
  timeout: 60

underwriting:
  max_tiv: 2000000
  prohibited_industries: ["Fireworks", "CryptoMining"]

email_processing:
  emails_dir: "emails"
  currency_fx_to_usd:
    GBP: 1.0
    USD: 1.0
    EUR: 1.0
  prohibited_territories:
    - "syrian arab republic"
    - "syria"
    - "damascus"
  injection_patterns: []

agents:
  - agent_id: "underwriter_agent"
    owner: "reference-sample"
    version: "1.0.0"
    effective_from: "2026-01-01"
    effective_until: null
    approved_by: null
    created_by: "compliance@example.com"
    created_at: "2025-02-17T10:00:00Z"
    priority: 10
    contract:
      role: EXECUTOR
      mission: |
        You are an insurance underwriter. Analyze the client application and propose
        a policy. Base premium on Total Insured Value (TiV) at ~2% of TiV, capped at max_tiv.
        NEVER propose for Fireworks or CryptoMining industries - these are prohibited.
        Output structured format.
      authorized_instruments: []
      allowed_policy_types: ["BIND", "DECLINE"]
      escalate_on_uncertainty: 0.65
      max_drawdown_limit: 0.05
      wake_up_threshold_pct: 0.5
      parent_agent_id: null
      max_tiv: 3000000
      prohibited_industries: ["Fireworks", "CryptoMining"]
