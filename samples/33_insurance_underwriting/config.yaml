# Digital Underwriter — Topology C (DL+PCI) + email ingestion

database:
  provider: sqlite
  db_path: "data/underwriting.dir.sqlite"

simulation:
  run_id: "uw_email_batch_001"
  seeds:
    llm: 42

llm_defaults:
  model: "gemma3:4b"
  base_url: "http://localhost:11434"
  timeout: 60

underwriting:
  max_tiv: 2000000
  prohibited_industries: ["Fireworks", "CryptoMining"]

email_processing:
  emails_dir: "emails"
  currency_fx_to_usd:
    GBP: 1.0
    USD: 1.0
    EUR: 1.0
  prohibited_territories:
    - "syrian arab republic"
    - "syria"
    - "damascus"
  injection_patterns: []

agents:
  - agent_id: "underwriter_agent"
    version: "1.0.0"
    created_by: "compliance@example.com"
    created_at: "2025-02-17T10:00:00Z"
    priority: 10
    contract:
      role: EXECUTOR
      mission: |
        You are an insurance underwriter. Analyze the client application and propose
        a policy. Base premium on Total Insured Value (TiV) at ~2% of TiV, capped at max_tiv.
        NEVER propose for Fireworks or CryptoMining industries - these are prohibited.
        Output structured format.
      authorized_instruments: []
      allowed_policy_types: ["BIND", "DECLINE"]
      escalate_on_uncertainty: 0.65
      max_drawdown_limit: 0.05
      wake_up_threshold_pct: 0.5
      parent_agent_id: null
      max_tiv: 3000000
      prohibited_industries: ["Fireworks", "CryptoMining"]
