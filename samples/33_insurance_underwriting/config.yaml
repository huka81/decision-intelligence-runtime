# Digital Underwriter - Topology C (DL+PCI) + email ingestion
# Default run processes markdown emails under emails/ (see README).

underwriting:
  max_tiv: 2000000
  prohibited_industries: ["Fireworks", "CryptoMining"]

llm_defaults:
  model: "gemma3:4b"
  base_url: "http://localhost:11434"

# Email pipeline: kernel gates, audit SQLite, mock bind API
# Broker-requested Total Insured Value (TiV) is inferred by the ROA agent from the email.
email_processing:
  emails_dir: "emails"
  audit_db: "data/underwriting_audit.sqlite"
  exclude_filename_substrings: ["HAILO"]
  # Demo FX: TiV amounts in GBP fixtures are compared to max_tiv as-if USD (1:1 stub).
  currency_fx_to_usd:
    GBP: 1.0
    USD: 1.0
    EUR: 1.0
  prohibited_territories:
    - "syrian arab republic"
    - "syria"
    - "damascus"
  # Optional substring scan before any LLM. Empty so prompt-injection demos rely on
  # extraction + contract (not naive keyword blocks).
  injection_patterns: []

agents:
  - agent_id: "underwriter_agent"
    version: "1.0.0"
    created_by: "compliance@example.com"
    created_at: "2025-02-17T10:00:00Z"
    mission: |
      You are an insurance underwriter. Analyze the client application and propose
      a policy. Base premium on Total Insured Value (TiV) at ~2% of TiV, capped at max_tiv.
      NEVER propose for Fireworks or CryptoMining industries - these are prohibited.
      Output structured format.
    contract:
      role: EXECUTOR
      max_tiv: 2000000
      prohibited_industries: ["Fireworks", "CryptoMining"]
      escalate_on_uncertainty: 0.65
