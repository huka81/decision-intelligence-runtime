# Digital Underwriter — Topology C (DL+PCI) + email ingestion

database:
  provider: sqlite
  db_path: "data/33_insurance_underwriting.db"

simulation:
  run_id: "uw_email_batch_001"
  seeds:
    llm: 42

# LLM backends — activate exactly one llm_defaults block (provider: ollama | mock | gemini).
# Inactive blocks stay commented. Gemini: set GOOGLE_API_KEY or GEMINI_API_KEY in the environment (do not put keys in this file).

# Ollama (local Gemma):
llm_defaults:
  provider: "ollama"
  model: "gemma3:4b"
  base_url: "http://localhost:11434"
  timeout: 60

# Mock (deterministic, no network):
# llm_defaults:
#   provider: "mock"
#   timeout: 60

# GCP Gemini via Google Generative AI (Gemini API):
# llm_defaults:
#   provider: "gemini"
#   model: "gemini-flash-lite-latest"
#   timeout: 60

email_processing:
  emails_dir: "emails"
  currency_fx_to_usd:
    GBP: 1.0
    USD: 1.0
    EUR: 1.0

agents:
  - agent_id: "underwriter_agent"
    owner: "reference-sample"
    version: "1.0.0"
    effective_from: "2026-01-01"
    effective_until: null
    approved_by: null
    created_by: "compliance@example.com"
    created_at: "2025-02-17T10:00:00Z"
    priority: 10
    contract:
      api_version: roa.dir/v1
      kind: ResponsibilityContract
      metadata:
        version: "1.0.0"
        owner: "reference-sample"
        effective_from: "2026-01-01"
        effective_until: null
        approved_by: null
        created_by: "compliance@example.com"
        created_at: "2025-02-17T10:00:00Z"
      subject:
        agent_id: underwriter_agent
        role: EXECUTOR
      mission: |
        Read the broker email and propose a BIND policy: total insured value,
        territory, and a short justification.
      authority:
        allowed_policy_types:
          - BIND
        invariants:
          - id: INV_TERRITORY
            type: set
            field: params.territory
            denied: ["syria", "damascus"]
            match: substring
            reason_code: PROHIBITED_TERRITORY
          - id: INV_MAX_TIV
            type: range
            field: params.total_insured_value
            max: 3000000
            reason_code: AUTHORITY_CEILING
