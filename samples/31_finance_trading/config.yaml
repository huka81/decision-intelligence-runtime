# EOAM Live Simulation - ROA agents with missions from config
# See docs/01-roa-manifesto/ROA_Manifesto.md and docs/03-topologies/DIR_Topologies.md

# persistence: postgres | sqlite | memory (see samples/shared/bootstrap.py).
# PostgreSQL: pip install psycopg2-binary; optional env overrides DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASS.
database:
  # provider: postgres
  # host: localhost
  # port: 5432
  # dbname: dir_quickstart
  # user: dir_user
  # password: do_not_store_password_this_way!
  provider: "sqlite"
  db_path: "data/31_finance_trading.db"

simulation:
  instruments: ["BTC-USD", "ETH-USD"]
  simulation_ticks: 4  # Extended for full position lifecycle visibility
  simulation_max_seconds: null  # Optional: max wall-clock seconds (null = no limit)
  tick_interval_sec: 0.1  # Faster ticks for quicker testing
  news_every_n_ticks: 5  # News every 5 ticks for more opportunities
  max_news_events: 8  # More news events for better position generation
  initial_prices:
    BTC-USD: 67500.0
    ETH-USD: 3500.0
  news_score_threshold: 0.50  # Lower threshold for more position openings
  # Take-profit and stop-loss thresholds for position management
  take_profit_pct: 0.03  # 3% profit target (wider tolerance)
  stop_loss_pct: 0.04  # 4% stop loss (wider tolerance for longer lifecycle)
  seeds:
    quote: 42
    news: 43

# Priority for arbitration: lower number = higher priority (EOAM Priority-Based Preemption)
# NOTE: OPEN_POSITION removed - positions opened exclusively via NEWS_QUALIFIED
priority_matrix:
  RISK_ALERT: 1
  CLOSE: 2
  CLOSE_POSITION: 2
  TAKE_PROFIT: 3
  ADJUST_STOP: 4
  ADJUST_RISK: 4
  NEWS_QUALIFIED: 5  # Exclusive entry point - opens positions when news score >= threshold
  HOLD: 10

# Optional LLM defaults (overridable per agent)
# Provider options: "ollama", "gemini", "mock" (or omit for auto-detection from model name)
#
# Example configurations:
#
# For Ollama (local):
llm_defaults:
  model: "gemma3:4b"
  base_url: "http://localhost:11434"
  provider: "ollama"  # Optional - auto-detected for non-gemini models

# For Gemini (cloud):
# llm_defaults:
#   provider: "gemini"  # Optional - auto-detected for gemini-* models
#   model: "gemma-4-31b-it"  
#   model: "gemini-flash-lite-latest"  # Updated to a more cost-effective model for testing
#   timeout: 60
#
# For Mock (testing without LLM):
# llm_defaults:
#   provider: "mock"
# Or set environment variable: USE_MOCK_LLM=1

# ============================================================================
# Agent Specifications
# ============================================================================
# 
# Wake-up Predicates (DIR Topologies §2.3 - Signal Suppression):
#   wake_up_threshold_pct: Minimum price change (%) required to invoke agent.
#   Prevents "Token Burn" by suppressing LLM invocations on minor signals.
#   - Instrument agents (strategic): 0.5% (less sensitive)
#   - Position agents (tactical): 0.3% (more sensitive for risk management)
#
agents:
  # Instrument agents - monitor market signals, DO NOT open positions directly
  # Positions are opened exclusively by news_scorer via NEWS_QUALIFIED trigger
  - agent_id: "instrument_btc_usd"
    type: instrument
    scope: "BTC-USD"
    mission: "Monitor market signals for BTC-USD. Analyze trends, volatility, and provide risk assessments. Wait for news-triggered opportunities - do not open positions directly."
    contract:
      role: MONITOR
      authorized_instruments: ["BTC-USD"]
      allowed_policy_types: ["ADJUST_RISK", "RISK_ALERT", "HOLD"]
      escalate_on_uncertainty: 0.65
      max_drawdown_limit: 0.05
      wake_up_threshold_pct: 0.8  # Wake-up only on 0.8%+ price change (Signal Suppression)
    priority: 8

  - agent_id: "instrument_eth_usd"
    type: instrument
    scope: "ETH-USD"
    mission: "Monitor market signals for ETH-USD. Analyze trends, volatility, and provide risk assessments. Wait for news-triggered opportunities - do not open positions directly."
    contract:
      role: MONITOR
      authorized_instruments: ["ETH-USD"]
      allowed_policy_types: ["ADJUST_RISK", "RISK_ALERT", "HOLD"]
      escalate_on_uncertainty: 0.65
      max_drawdown_limit: 0.05
      wake_up_threshold_pct: 0.8  # Wake-up only on 0.8%+ price change (Signal Suppression)
    priority: 8

  # News scorer - EXCLUSIVE entry point for all positions
  # Evaluates news impact and opens positions when score >= news_score_threshold (0.50)
  - agent_id: "news_scorer"
    type: news_scorer
    scope: null
    mission: "Evaluate news impact on instruments. When news score >= 0.50 threshold, emit NEWS_QUALIFIED to open position for affected instruments. This is the exclusive entry point for all trading positions."
    contract:
      role: STRATEGIST
      authorized_instruments: []
      allowed_policy_types: ["NEWS_QUALIFIED", "HOLD"]
      escalate_on_uncertainty: 0.6
      max_drawdown_limit: 0.05
    priority: 5

  # Position manager template - spawned ONLY by NEWS_QUALIFIED trigger from news_scorer
  # Each position manages one instrument opened due to high-impact news
  - agent_id: "position_template"
    type: position
    scope: null  # Set per spawned instance to instrument symbol
    mission: |
      Manage this news-triggered position. You have USD exposure to protect.
      Decision rules:
      - TAKE_PROFIT: When P&L >= +3% (profit target hit) - CLOSE the position
      - CLOSE: When P&L <= -4% (stop loss) or when you decide to exit
      - REDUCE: When volatility increases but P&L is still positive - cut exposure by 50%
      - HOLD: When P&L is between -2% and +2% and conditions stable
      - ADJUST_STOP: When trailing stop needs adjustment
      Always state your decision clearly with price levels and reasoning.
    contract:
      role: EXECUTOR
      authorized_instruments: []  # Filled at spawn: [instrument]
      allowed_policy_types: ["TAKE_PROFIT", "CLOSE", "REDUCE", "HOLD", "ADJUST_STOP"]
      escalate_on_uncertainty: 0.70
      max_drawdown_limit: 0.04  # 4% stop loss in USD terms (wider tolerance)
      take_profit_pct: 0.03  # 3% profit target (wider tolerance)
      max_exposure: 5000.0  # $5,000 per position for realistic P&L
      reduce_pct: 0.5  # 50% reduction on REDUCE
      wake_up_threshold_pct: 0.5  # More sensitive for position management (0.5%)
      parent_agent_id: null  # Always 'news_scorer' - positions only opened by news
    priority: 4
