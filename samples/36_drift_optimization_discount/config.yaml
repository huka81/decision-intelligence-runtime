# Sample 36: DIR runtime — persistence, LLM, contracts, DIM, paths.
# Experiment definition (phases, drift curve, monitor): see simulation.yaml

database:
  provider: sqlite
  db_path: data/36_drift_optimization_discount.db

llm_defaults:
  provider: mock
  model: retention-sim
  timeout: 60

contracts:
  provider: yaml
  # path defaults to the same file as setup_environment(..., config_path=...)

agents:
  - agent_id: RetentionAgent
    mission: Retain subscribers who request cancellation by offering a retention discount.
    priority: 10
    contract:
      api_version: roa.dir/v1
      kind: ResponsibilityContract
      subject:
        agent_id: RetentionAgent
        role: EXECUTOR
        parent_agent_id: null
      mission: Retain subscribers who request cancellation by offering a retention discount.
      authority:
        allowed_policy_types: [retention_discount]
        limits:
          max_discount_pct: { value: 15.0, unit: percent }
      execution_conditions:
        wake_up_threshold_pct: 0.5
      responsibility:
        escalation:
          mode: conditional
          confidence_below: 0.7

paths:
  inputs_file: data/cancelation.json

# Overlay: simulation + monitor blocks are read from this file (anchored to this YAML dir).
simulation_config: simulation.yaml

dim:
  allowed_agents:
    - RetentionAgent
  context_state:
    risk_score: 0.1

registry:
  supported_versions: "1.x"
