# 35 - CrewAI ROA wrapper — runtime config (Sample Guide §7)
database:
  provider: sqlite
  db_path: "data/crewai_roa.db"

llm_defaults:
  model: "gemma3:4b"
  base_url: "http://localhost:11434"
  temperature: 0.2

simulation:
  run_id: "crewai_claims_batch_001"
  seeds: {}

agents:
  - agent_id: "claims_agent_v1"
    priority: 10
    crew:
      analyst_role: "Claims Analyst"
      analyst_goal: "Analyze a customer refund claim and summarize eligibility."
      decision_maker_role: "Decision Maker"
      decision_maker_goal: >
        Based on analyst findings, produce a refund proposal as JSON.
        Use action=REFUND always. The DIR Kernel enforces all limits.
    contract:
      role: EXECUTOR
      mission: >
        Process customer claims fairly, within policy boundaries,
        without exceeding authority or escalating unnecessarily.
      authorized_instruments:
        - electronics
        - clothing
        - home
      allowed_policy_types:
        - REFUND
        - REPLACE
        - ESCALATE
      escalate_on_uncertainty: 0.7
      max_drawdown_limit: 0.05
      wake_up_threshold_pct: 0.5
      parent_agent_id: null
    claims_bounds:
      max_refund_without_escalation: 500.0
      return_window_days: 14

context_store:
  orders:
    ord_001:
      purchase_date: "2026-04-10T10:00:00Z"
      category: electronics
      amount: 299.99
    ord_002:
      purchase_date: "2026-04-12T10:00:00Z"
      category: electronics
      amount: 1200.00
    ord_003:
      purchase_date: "2026-04-11T10:00:00Z"
      category: clothing
      amount: 89.99
    ord_004:
      purchase_date: "2026-04-10T10:00:00Z"
      category: prohibited_category
      amount: 50.00
    ord_005:
      purchase_date: "2026-01-01T10:00:00Z"
      category: electronics
      amount: 500.00
