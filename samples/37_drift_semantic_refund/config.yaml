# Sample 37: DIR runtime — persistence, LLM (mock default), contracts, DIM, paths.

database:
  provider: sqlite
  db_path: data/37_drift_semantic_refund.db

llm_defaults:
  provider: mock
  model: refund-sim
  timeout: 60

contracts:
  provider: yaml

agents:
  - agent_id: RefundAgent
    mission: "Resolve customer complaints about delayed shipping; issue refunds only when delay exceeds policy."
    priority: 0
    contract:
      api_version: roa.dir/v1
      kind: ResponsibilityContract
      subject:
        agent_id: RefundAgent
        role: EXECUTOR
        parent_agent_id: null
      mission: "Resolve customer complaints about delayed shipping; issue refunds only when delay exceeds policy."
      authority:
        allowed_policy_types: [REFUND]
        limits:
          max_refund_eur: { value: 50.0, unit: EUR }
      execution_conditions:
        wake_up_threshold_pct: 0.5
      responsibility:
        escalation:
          mode: conditional
          confidence_below: 0.7

paths:
  inputs_file: data/support_tickets.json

simulation:
  run_id: run_37_semantic_refund_01
  seeds:
    refund: 37
  normal_phase_iterations: 20
  simulation_seed: 37
  emotional_keywords:
    - ruined
    - lawyer
    - scandal
    - wedding
  refund_amount_compliant_eur: 35.0
  refund_amount_drift_eur: 40.0

dim:
  allowed_agents: []
  context_state:
    risk_score: 0.1

monitor:
  window_size: 20
  violation_rate_threshold: 0.15
  suspension_reason: SEMANTIC_RULE_VIOLATION_DRIFT
  min_delay_hours_for_refund: 48.0

registry:
  supported_versions: "1.x"
