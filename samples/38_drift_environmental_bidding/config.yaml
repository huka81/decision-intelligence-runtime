# --- Persistence (canonical StorageBundle) ---
database:
  provider: sqlite
  db_path: data/38_drift_environmental_bidding.db

# --- LLM (mock; this sample uses deterministic simulated ROA, not live LLM) ---
llm_defaults:
  provider: mock
  model: mock-bidding
  timeout: 60

contracts:
  provider: yaml

simulation:
  run_id: bidding_drift_38
  seeds:
    market: 38
  normal_phase_iterations: 30
  market_cpc_start: 1.20
  market_cpc_end: 1.98
  market_cpc_noise_pp: 0.02
  simulation_seed: 38
  bid_margin_above_market: 0.02

paths:
  inputs_file: data/market_conditions.json

dim:
  allowed_agents:
    - BiddingAgent
  context_state:
    risk_score: 0.1

monitor:
  window_size: 10
  ltv_usd: 1.80
  negative_roi_consecutive_cycles: 5
  suspension_reason: NEGATIVE_ROI_ENVIRONMENTAL_DRIFT

registry:
  supported_versions: "1.x"

agents:
  - agent_id: BiddingAgent
    agent_version: "1.0.0"
    priority: 10
    contract:
        api_version: roa.dir/v1
        kind: ResponsibilityContract
        subject:
          agent_id: BiddingAgent
          role: EXECUTOR
          parent_agent_id: null
        mission: "Maintain top 3 ad placement for key search terms without exceeding the contract CPC ceiling."
        authority:
          allowed_policy_types: [cpc_bid]
          limits:
            max_drawdown_limit: 2.00
        execution_conditions:
          wake_up_threshold_pct: 0.5
        responsibility:
          escalation:
            mode: conditional
            confidence_below: 0.5
