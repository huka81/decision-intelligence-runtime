[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dir-runtime"
version = "0.1.0"
description = "Decision Intelligence Runtime – shared package for ROA/DIR samples"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1"]
eoam = ["httpx", "pyyaml", "plotly"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
